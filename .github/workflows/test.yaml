name: test
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          # the floor the go directive promises; also the newest release right now
          - "1.26.x"
    name: Go ${{ matrix.go }}
    steps:
      # actions are pinned to a commit SHA so a moved tag cannot change what runs;
      # the trailing comment is the release that SHA came from, kept current by dependabot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: fuzz smoke test
        run: |
          # `go test -fuzz` exits zero when the pattern matches nothing,
          # so verify each target exists before fuzzing it
          for target in FuzzReadAll FuzzReadSections FuzzReadAllLenient FuzzReadersAgree; do
            go test -list="^${target}\$" . | grep -q "^${target}\$" || { echo "no such fuzz target: ${target}"; exit 1; }
            go test -run=XXX -fuzz="^${target}\$" -fuzztime=20s .
          done
      - name: benchmark smoke test
        # one iteration each, so the benchmarks backing the README/PR numbers cannot rot
        run: go test -run=XXX -bench=. -benchtime=1x .
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false
